<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>

<div class="login-container">
    <h2>Welcome to the Dashboard</h2>

    <p>Select a section:</p>

    <button onclick="window.location.href='/announcements'">Announcements</button>

    {% if actor and actor.role in ['Teacher', 'Parent'] %}
        <!-- CNS-011 / T2-025. Only these two roles, everybody else gets a 403
             on /messages, so a button for them would promise nothing. -->
        <button onclick="window.location.href='/messages'">Messages</button>
    {% endif %}

    {% if actor and actor.role == 'Parent' %}
        <!-- Parents only see this button -->
        <button onclick="window.location.href='/parent/portal'">Parent Portal</button>
    {% else %}
        <!-- Staff and Admins see these buttons -->
        <button onclick="window.location.href='/students'">Students</button>
        <button onclick="window.location.href='/teachers'">Teachers</button>
        <button onclick="window.location.href='/classes'">Classes</button>
    {% endif %}
</div>

</body>
</html>
