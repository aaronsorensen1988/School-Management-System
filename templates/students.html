<!DOCTYPE html>
<html>
<head>
    <title>Students</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>

<div class="login-container" style="width:520px;">
    <h2>Students</h2>

    <table style="width:100%; text-align:left; margin-top:20px;">
        <tr>
            <th>Student ID</th>
            <th>Name</th>
            <th>Grade</th>
            <th>Profile</th>
        </tr>

        {% for s in students %}
        <tr>
            <td>{{ s.student_number }}</td>
            <td>{{ s.name }}</td>
            <td>{{ s.grade }}</td>
            <td>
                <button onclick="window.location.href='/ui/student/{{ s.id }}'">
                    View Profile
                </button>
            </td>
        </tr>
        {% else %}
        <tr>
            <td colspan="4">No students yet. Click "Add Student" to enroll the first one.</td>
        </tr>
        {% endfor %}
    </table>

    <br>
    <button onclick="window.location.href='/students/new'">Add Student</button>

    <br>
    <button onclick="window.location.href='/dashboard'">Back to Dashboard</button>
</div>

</body>
</html>
